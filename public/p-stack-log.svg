<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 배경은 투명하게 처리 -->
  <rect x="0" y="0" width="200" height="200" rx="20" fill="transparent"/>
  
  <!-- 육각형 스택 구조 - 색상 순서 변경 -->
  <g transform="translate(60, 10)">
    <!-- 맨 아래 육각형 -->
    <path d="M40 90 L80 110 L80 130 L40 150 L0 130 L0 110 Z" 
          fill="#90CDF4"
          opacity="0.95"/>
    
    <!-- 중간 육각형 -->
    <path d="M40 65 L80 85 L80 105 L40 125 L0 105 L0 85 Z" 
          fill="#63B3ED"
          opacity="0.9"/>
    
    <!-- 맨 위 육각형 -->
    <path d="M40 40 L80 60 L80 80 L40 100 L0 80 L0 60 Z" 
          fill="#4299E1"
          opacity="0.85"/>

    <!-- 상단 그림자 효과 -->
    <path d="M40 40 L80 60 L40 80 L0 60 Z" 
          fill="#2B6CB0"
          opacity="0.8"/>
  </g>
</svg>